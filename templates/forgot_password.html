<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password | AI Resume Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/resume_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/review.css') }}">
</head>
<body>
    <div class="bg-animated"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="review-page login-page">
        <div class="dashboard-container login-wrap">
            <div class="dashboard-header">
                <h1>Reset <span class="text-gradient">password</span></h1>
                <p class="summary-text">Enter the email on your account. A reset link will be sent to that address.</p>
            </div>

            {% if error %}
            <div class="banner err">{{ error }}</div>
            {% endif %}

            <form class="login-form" method="post" action="{{ url_for('forgot_password') }}">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.email }}" placeholder="name@email.com">
                </div>
                <button type="submit">Send reset link</button>
            </form>
            <p class="auth-switch"><a href="{{ url_for('login') }}">Back to login</a></p>
        </div>
    </div>
</body>
</html>
