# Render Blueprint for the IntegrateAI Flask app.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-career-research-assistant
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: LINKEDIN_APIFY_ACTOR
        value: valig/linkedin-jobs-scraper
      - key: NAUKRI_APIFY_ACTOR
        value: k1ra/naukri-jobs-scraper
      - key: APIFY_JOB_LIMIT
        value: "15"
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
